<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>רועי & שיראל | The Wedding Day</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f1eb;
      color: #3d3934;
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: #faf9f6;
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 45px 25px;
      position: relative;
      background:
        linear-gradient(rgba(250,249,246,0.91), rgba(250,249,246,0.91)),
        radial-gradient(circle at top, #e7e0d5, transparent 60%);
    }

    .top-line {
      width: 100%;
      height: 1px;
      background: #9b9183;
      margin-bottom: 35px;
      opacity: 0.7;
    }

    .small {
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 28px;
      color: #81786c;
    }

    .names {
      font-size: 48px;
      font-weight: normal;
      letter-spacing: 2px;
      color: #25221f;
      margin-bottom: 10px;
    }

    .amp {
      font-size: 25px;
      font-style: italic;
      color: #948a7d;
      margin: 5px 0;
    }

    .wedding {
      font-size: 15px;
      letter-spacing: 5px;
      color: #82786c;
      margin-top: 18px;
      margin-bottom: 45px;
    }

    .ornament {
      font-size: 30px;
      color: #948a7d;
      margin-bottom: 35px;
    }

    .venue {
      font-size: 23px;
      margin-bottom: 8px;
      color: #45403a;
    }

    .venue-sub {
      font-size: 14px;
      letter-spacing: 2px;
      color: #887e71;
      margin-bottom: 45px;
    }

    /* התאריך מוסתר כרגע */
    .date-hidden {
      display: none;
    }

    .buttons {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 55px;
      border: 1px solid #91877a;
      background: #faf9f6;
      color: #4a443d;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 16px;
      transition: 0.25s;
      cursor: pointer;
      border-radius: 2px;
    }

    .button:hover {
      background: #eeeae3;
      transform: translateY(-1px);
    }

    .button.main {
      background: #514b44;
      color: white;
      border-color: #514b44;
    }

    .button.main:hover {
      background: #3d3833;
    }

    .button.bit {
      border-color: #7d8b76;
    }

    .button.card {
      border-color: #81776b;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #9a9186;
      letter-spacing: 2px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30,27,24,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 420px;
      background: #faf9f6;
      padding: 35px 25px;
      text-align: center;
      border: 1px solid #a09688;
      position: relative;
    }

    .modal-content h2 {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .modal-content p {
      color: #756d63;
      margin-bottom: 25px;
      font-family: Arial, sans-serif;
    }

    .close {
      position: absolute;
      left: 15px;
      top: 10px;
      font-size: 25px;
      cursor: pointer;
      color: #777;
    }

    .choice {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #999084;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      color: #4a443d;
    }

    .choice:hover {
      background: #eeeae3;
    }

    @media (max-width: 400px) {
      .names {
        font-size: 40px;
      }

      .wedding {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <section class="hero">

    <div class="top-line"></div>

    <div class="small">SAVE THE DATE</div>

    <div class="names">רועי</div>
    <div class="amp">&amp;</div>
    <div class="names">שיראל</div>

    <div class="wedding">THE WEDDING DAY</div>

    <div class="ornament">✦</div>

    <div class="venue">מתחם האירועים ADIA</div>
    <div class="venue-sub">ADIA EVENTS</div>

    <!-- התאריך קיים אבל מוסתר כרגע -->
    <div class="date-hidden">
      27.12.2026 | 19:30
    </div>

    <div class="buttons">

      <button class="button main" onclick="openRSVP()">
        💌 אישור הגעה
      </button>

      <a class="button" href="https://www.waze.com/" target="_blank">
        📍 ניווט לאירוע
      </a>

      <a class="button" href="#" onclick="addToCalendar(event)">
        📅 הוספה ליומן
      </a>

      <a class="button bit" href="#" onclick="openBit(event)">
        💚 מתנה ב-Bit
      </a>

      <a class="button card" href="#" onclick="openCredit(event)">
        💳 מתנה באשראי
      </a>

    </div>

    <div class="footer">
      WITH LOVE • ROEI & SHIREL
    </div>

  </section>

</div>


<!-- חלון אישור הגעה -->
<div class="modal" id="rsvpModal">

  <div class="modal-content">

    <span class="close" onclick="closeRSVP()">×</span>

    <h2>אישור הגעה</h2>

    <p>
      נשמח לדעת אם תוכלו לחגוג איתנו ❤️
    </p>

    <button class="choice" onclick="rsvpYes()">
      ❤️ כן, אני מגיע/ה
    </button>

    <button class="choice" onclick="rsvpNo()">
      לצערי לא אוכל להגיע
    </button>

  </div>

</div>


<script>

  function openRSVP() {
    document.getElementById("rsvpModal").style.display = "flex";
  }

  function closeRSVP() {
    document.getElementById("rsvpModal").style.display = "none";
  }

  function rsvpYes() {
    alert("מעולה ❤️ בשלב הבא נחבר כאן את טופס אישור ההגעה.");
  }

  function rsvpNo() {
    alert("תודה על העדכון ❤️");
  }

  /*
    BIT
    כאן נחבר בהמשך את קישור ה-Bit שלכם.
  */
  function openBit(event) {
    event.preventDefault();

    alert("כאן נחבר את קישור ה-Bit שלכם.");
  }

  /*
    אשראי
    כאן נחבר בהמשך את עמוד הסליקה.
  */
  function openCredit(event) {
    event.preventDefault();

    alert("כאן נחבר את עמוד התשלום באשראי.");
  }

  /*
    הוספה ליומן
  */
  function addToCalendar(event) {
    event.preventDefault();

    const title = "החתונה של רועי ושיראל";
    const start = "20261227T193000";
    const end = "20261227T233000";

    const url =
      "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(title) +
      "&dates=" + start + "/" + end +
      "&location=" + encodeURIComponent("מתחם האירועים ADIA");

    window.open(url, "_blank");
  }

</script>

</body>
</html>
